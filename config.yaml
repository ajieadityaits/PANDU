app:
  window_title: "PANDU - Tekan Q untuk keluar"
  # Pilih Logitech berdasarkan identitas, bukan asumsi indeks kamera.
  # VID USB resmi perangkat Logitech adalah 046D.
  camera_name: "Logitech"
  camera_vendor_id: "046D"
  # Jika false, aplikasi tidak diam-diam beralih ke integrated webcam.
  allow_camera_fallback: false
  # Dipakai saat --camera-index diberikan atau fallback diizinkan.
  camera_index: "auto"
  camera_scan_max_index: 5
  prefer_external_camera: true
  # DirectShow menjaga pasangan nama, indeks, dan backend tetap konsisten.
  camera_backend: "dshow"
  frame_width: 1280
  frame_height: 720
  show_fps: true

model:
  name: "yolo11n.pt"
  confidence_threshold: 0.45
  image_size: 640
  device: null  # null = dipilih otomatis; contoh lain: "cpu", 0

decision:
  left_boundary: 0.33
  right_boundary: 0.67
  cooldown_seconds: 6.0
  stability_frames: 3
  center_bonus: 2.0
  area_multiplier: 10.0
  confidence_multiplier: 1.0

speech:
  enabled: true
  # auto memakai Windows SAPI langsung di Windows dan pyttsx3 di platform lain.
  backend: "auto"
  rate: 175
  volume: 1.0
  queue_size: 3

# Nama kelas di bawah mengikuti dataset COCO bawaan YOLO.
# Angka yang lebih besar berarti lebih diprioritaskan untuk diumumkan.
